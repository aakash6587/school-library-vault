<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Christian High School | Steganography Vault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #060a13 url('/static/bg.png') no-repeat center center/cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: #e2e8f0;
            padding: 30px 20px;
        }
        .header-bar {
            max-width: 1000px;
            margin: 0 auto 20px auto;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.25);
            padding: 16px 24px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title { font-size: 18px; font-weight: 700; color: #00f3ff; letter-spacing: 1px; }
        .status { font-size: 12px; background: rgba(52, 211, 153, 0.15); color: #34d399; padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(52, 211, 153, 0.3); font-weight: 600; }
        
        .mode-toggle {
            max-width: 1000px;
            margin: 0 auto 25px auto;
            display: flex;
            gap: 10px;
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            color: #94a3b8;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            text-align: center;
            font-size: 12px;
        }
        .mode-btn.active {
            background: rgba(0, 243, 255, 0.15);
            color: #00f3ff;
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        .card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .card h2 { font-size: 14px; color: #00f3ff; margin-bottom: 18px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px dashed rgba(255, 255, 255, 0.15); padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="file"], input[type="password"], textarea {
            width: 100%;
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        textarea { resize: vertical; min-height: 70px; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        button:hover { background: linear-gradient(135deg, #0369a1, #075985); }
        .output-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px dashed rgba(0, 243, 255, 0.3);
            border-radius: 6px;
            font-size: 12px;
            display: none;
        }
        .section-panel { display: none; }
        .section-panel.active { display: grid; }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="title">🔒 COVERT STEGANOGRAPHY VAULT</div>
    <div class="status">● SESSION AUTHENTICATED</div>
</div>

<div class="mode-toggle">
    <div class="mode-btn active" onclick="switchMode('text')">📝 Text-in-Image</div>
    <div class="mode-btn" onclick="switchMode('image')">🖼️ Image-in-Image</div>
    <div class="mode-btn" onclick="switchMode('dual')">🔐 Dual Stego (Text + Image)</div>
</div>

<!-- TEXT SECTION -->
<div id="textSection" class="grid section-panel active">
    <div class="card">
        <h2>[01] Embed Secret Text</h2>
        <form action="/encode" method="POST" enctype="multipart/form-data">
            <div class="form-group"><label>Cover Image</label><input type="file" name="image" required accept="image/*"></div>
            <div class="form-group"><label>Secret Text</label><textarea name="message" required></textarea></div>
            <div class="form-group"><label>Passkey</label><input type="password" name="key" required></div>
            <button type="submit">Embed Text & Download</button>
        </form>
    </div>
    <div class="card">
        <h2>[02] Extract Secret Text</h2>
        <form id="decodeForm" enctype="multipart/form-data">
            <div class="form-group"><label>Stego Image</label><input type="file" id="stego_image" required accept="image/*"></div>
            <div class="form-group"><label>Passkey</label><input type="password" id="decode_key" required></div>
            <button type="submit">Extract Text</button>
        </form>
        <div id="output" class="output-box"></div>
    </div>
</div>

<!-- IMAGE IN IMAGE SECTION -->
<div id="imageSection" class="grid section-panel">
    <div class="card">
        <h2>[01] Hide Image in Image</h2>
        <form action="/encode_img" method="POST" enctype="multipart/form-data">
            <div class="form-group"><label>Cover Image</label><input type="file" name="cover_image" required accept="image/*"></div>
            <div class="form-group"><label>Secret Image</label><input type="file" name="secret_image" required accept="image/*"></div>
            <button type="submit">Hide Image & Download</button>
        </form>
    </div>
    <div class="card">
        <h2>[02] Extract Hidden Image</h2>
        <form action="/decode_img" method="POST" enctype="multipart/form-data">
            <div class="form-group"><label>Stego Image</label><input type="file" name="stego_image" required accept="image/*"></div>
            <button type="submit">Extract Image</button>
        </form>
    </div>
</div>

<!-- DUAL STEGO SECTION -->
<div id="dualSection" class="grid section-panel">
    <div class="card">
        <h2>[01] Hide Text + Image Together</h2>
        <form action="/encode_dual" method="POST" enctype="multipart/form-data">
            <div class="form-group"><label>Cover Image</label><input type="file" name="cover_image" required accept="image/*"></div>
            <div class="form-group"><label>Secret Image</label><input type="file" name="secret_image" required accept="image/*"></div>
            <div class="form-group"><label>Secret Text</label><textarea name="message" placeholder="Confidential note..." required></textarea></div>
            <button type="submit">Embed Both & Download</button>
        </form>
    </div>
    <div class="card">
        <h2>[02] Extract Text + Image</h2>
        <form id="dualDecodeForm" enctype="multipart/form-data">
            <div class="form-group"><label>Dual Stego Image</label><input type="file" id="dual_stego_img" required accept="image/*"></div>
            <button type="submit">Extract Both Payload Data</button>
        </form>
        <div id="dualOutput" class="output-box"></div>
    </div>
</div>

<script>
function switchMode(mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section-panel').forEach(s => s.classList.remove('active'));

    if (mode === 'text') {
        document.querySelectorAll('.mode-btn')[0].classList.add('active');
        document.getElementById('textSection').classList.add('active');
    } else if (mode === 'image') {
        document.querySelectorAll('.mode-btn')[1].classList.add('active');
        document.getElementById('imageSection').classList.add('active');
    } else {
        document.querySelectorAll('.mode-btn')[2].classList.add('active');
        document.getElementById('dualSection').classList.add('active');
    }
}

document.getElementById('decodeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData();
    formData.append('stego_image', document.getElementById('stego_image').files[0]);
    formData.append('key', document.getElementById('decode_key').value);
    const res = await fetch('/decode', { method: 'POST', body: formData });
    const data = await res.json();
    const out = document.getElementById('output');
    out.style.display = 'block';
    out.innerText = data.success ? "SUCCESS: " + data.result : "ERROR: " + data.result;
});

document.getElementById('dualDecodeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData();
    formData.append('stego_image', document.getElementById('dual_stego_img').files[0]);
    const res = await fetch('/decode_dual', { method: 'POST', body: formData });
    const data = await res.json();
    const out = document.getElementById('dualOutput');
    out.style.display = 'block';
    if (data.success) {
        out.innerHTML = `<span style="color:#34d399;"><strong>TEXT payload:</strong> ${data.result_text}</span><br><br><a href="${data.extracted_image_url}" download style="color:#00f3ff;">📥 Download Extracted Secret Image</a>`;
    } else {
        out.innerHTML = `<span style="color:#f87171;">ERROR: Could not decode dual payload.</span>`;
    }
});
</script>

</body>
</html>
