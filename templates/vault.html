<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Christian High School | Steganography Vault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #060a13 url('/static/bg.png') no-repeat center center/cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: #e2e8f0;
            padding: 30px 20px;
        }
        .header-bar {
            max-width: 1000px;
            margin: 0 auto 30px auto;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.25);
            padding: 16px 24px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title { font-size: 18px; font-weight: 700; color: #00f3ff; letter-spacing: 1px; }
        .status { font-size: 12px; background: rgba(52, 211, 153, 0.15); color: #34d399; padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(52, 211, 153, 0.3); font-weight: 600; }
        .grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .card h2 { font-size: 15px; color: #00f3ff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px dashed rgba(255, 255, 255, 0.15); padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="file"], input[type="password"], textarea {
            width: 100%;
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus { border-color: #00f3ff; outline: none; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        button:hover { background: linear-gradient(135deg, #0369a1, #075985); }
        #output {
            margin-top: 18px;
            padding: 14px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px dashed rgba(0, 243, 255, 0.3);
            border-radius: 6px;
            font-size: 13px;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="title">🔒 COVERT STEGANOGRAPHY VAULT</div>
    <div class="status">● SESSION AUTHENTICATED</div>
</div>

<div class="grid">
    <!-- ENCODE PANEL -->
    <div class="card">
        <h2>[01] Embed Secret Data</h2>
        <form action="/encode" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Cover Image (PNG/JPG)</label>
                <input type="file" name="image" required accept="image/*">
            </div>
            <div class="form-group">
                <label>Secret Payload Message</label>
                <textarea name="message" placeholder="Type confidential data..." required></textarea>
            </div>
            <div class="form-group">
                <label>Encryption Passkey</label>
                <input type="password" name="key" placeholder="••••••••" required>
            </div>
            <button type="submit">Generate & Download Stego Image</button>
        </form>
    </div>

    <!-- DECODE PANEL -->
    <div class="card">
        <h2>[02] Extract Secret Data</h2>
        <form id="decodeForm" enctype="multipart/form-data">
            <div class="form-group">
                <label>Stego Image File</label>
                <input type="file" id="stego_image" required accept="image/*">
            </div>
            <div class="form-group">
                <label>Decryption Passkey</label>
                <input type="password" id="decode_key" placeholder="••••••••" required>
            </div>
            <button type="submit">Extract & Decrypt Payload</button>
        </form>
        <div id="output"></div>
    </div>
</div>

<script>
document.getElementById('decodeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData();
    formData.append('stego_image', document.getElementById('stego_image').files[0]);
    formData.append('key', document.getElementById('decode_key').value);

    const res = await fetch('/decode', { method: 'POST', body: formData });
    const data = await res.json();
    
    const out = document.getElementById('output');
    out.style.display = 'block';
    
    if (data.success) {
        out.style.color = '#34d399';
        out.innerText = "SUCCESS: " + data.result;
    } else {
        out.style.color = '#f87171';
        out.innerText = "ERROR: " + data.result;
    }
});
</script>

</body>
</html>
