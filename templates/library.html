<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Christian High School | Central Library Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #060a13 url('/static/bg.png') no-repeat center center/cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 40px 8%;
        }
        .card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid rgba(0, 243, 255, 0.25);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .icon-badge {
            width: 50px;
            height: 50px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            color: #00f3ff;
            font-size: 22px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .card h2 {
            font-size: 20px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .school-subtitle {
            color: #00f3ff;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        select, input {
            width: 100%;
            padding: 11px 13px;
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-size: 13px;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        select option {
            background: #0f172a;
            color: #ffffff;
        }
        select:focus, input:focus {
            border-color: #00f3ff;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.25);
        }
        .book-list-box {
            background: rgba(2, 6, 23, 0.6);
            border: 1px dashed rgba(0, 243, 255, 0.25);
            border-radius: 8px;
            padding: 10px;
            max-height: 110px;
            overflow-y: auto;
            margin-bottom: 16px;
            text-align: left;
            display: none;
        }
        .book-item {
            font-size: 12px;
            color: #cbd5e1;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .book-item:hover {
            background: rgba(0, 243, 255, 0.15);
            color: #00f3ff;
        }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            transition: all 0.2s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-1px);
        }
        #output {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #38bdf8;
            font-size: 12px;
            text-align: center;
            display: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-badge">📖</div>
    <h2>Asian Christian High School</h2>
    <div class="school-subtitle">Central Library Catalog Portal</div>
    
    <!-- Genre Filter -->
    <div class="form-group">
        <label>1. Select Genre / Category</label>
        <select id="genre_select">
            <option value="">-- Choose Genre --</option>
            {% for g in genres %}
            <option value="{{ g }}">{{ g }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Dynamic Book List Box -->
    <div id="book_list_box" class="book-list-box"></div>

    <!-- Search Form -->
    <form id="searchForm">
        <div class="form-group">
            <label>2. Book Title</label>
            <input type="text" id="book_title" placeholder="Type or click a book title above..." required>
        </div>
        
        <div class="form-group">
            <label>Book Serial / Accession No</label>
            <input type="text" id="book_no" placeholder="e.g. 1042" required>
        </div>
        
        <button type="submit">Search Availability & Location</button>
    </form>
    
    <div id="output"></div>
</div>

<script>
// Load books when genre is selected
document.getElementById('genre_select').addEventListener('change', async (e) => {
    const genre = e.target.value;
    const listBox = document.getElementById('book_list_box');
    
    if (!genre) {
        listBox.style.display = 'none';
        return;
    }

    const res = await fetch('/get_books_by_genre', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ genre: genre })
    });
    const data = await res.json();

    listBox.innerHTML = '<div style="font-size: 10px; color: #00f3ff; margin-bottom: 5px; font-weight: bold;">AVAILABLE IN THIS GENRE (CLICK TO SELECT):</div>';
    data.books.forEach(title => {
        const item = document.createElement('div');
        item.className = 'book-item';
        item.innerText = '• ' + title;
        item.onclick = () => {
            document.getElementById('book_title').value = title;
        };
        listBox.appendChild(item);
    });
    listBox.style.display = 'block';
});

// Submit Search
document.getElementById('searchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData();
    formData.append('book_title', document.getElementById('book_title').value);
    formData.append('book_no', document.getElementById('book_no').value);

    const res = await fetch('/search_book', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.status === 'covert_unlock') {
        window.location.href = data.redirect;
    } else {
        const out = document.getElementById('output');
        out.style.display = 'block';
        out.innerText = data.message;
    }
});
</script>

</body>
</html>
